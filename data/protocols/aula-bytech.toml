# AULA `bytech` -- the protocol family our HERO 84 HE actually speaks.
#
# Distinct from `aula-hero84-he`, which is a *product* entry and stays empty.
# The family boundary here is the vendor's own: the application picks a protocol
# module per device by an `sdkModuleName`, our board resolves to `bytech`, and
# `bytech` is the only module in the vendor bundle that binds this keyboard
# codec. One frame format, one builder, one decoder, one response validator,
# instantiated in exactly one place (docs/prior-art/aula-webhid.md).
#
# What that buys and what it does not: it shows the vendor's *driver* hands
# every `bytech` board the same encoder. It does not show that every such
# board's *firmware* answers the same way. The family evidence stays
# VendorArtifact for every board except the one an exchange actually happened
# on.
#
# This file contains exactly one entry on purpose. The rest of the family's
# command namespace was readable during the same pass and was deliberately not
# written down: an opcode recorded here is an opcode someone can be tempted to
# classify, and the vertical slice needs one read.

schema       = "peripheral.opcode-acl/2"
family       = "aula-bytech"
display_name = "AULA bytech (keyboard)"
note         = "Vendor-defined protocol family, named after the vendor's own SDK module rather than after any product. Config endpoint 0xFF60:0x0061; 63-byte frames both directions with the report id prepended by the HID write; checksum seeded with the report id. Membership established for HERO 84 HE (VID 0x372E PID 0x103E) from the vendor's module binding, not from its 'BY Tech' manufacturer string, and confirmed by exchange on 2026-08-18 (docs/hardware/aula-bytech-exchange-001.md)."

# No [timing.class.*] section, and that is not an omission.
#
# One command in this family has been measured, and its number is declared on
# the command below rather than on its class. Writing it into
# [timing.class.safe_read] would claim the same cadence for every safe_read this
# family ever gains -- including commands nobody has sent. A measurement is
# evidence about the thing that was measured. The next command earns its own.

[timing.command.read_model_id]
min_gap_before_ms = 1000
settle_after_ms   = 0
evidence          = "hardware"
note              = "Not the device's minimum interval -- nobody measured one, and looking for one was explicitly out of scope. This is a ceiling Peripheral chooses and has exercised: 5 exchanges at >= 1000 ms on our own HERO 84 HE, every answer structurally valid, every answer the same value, every response checksum matching, no stall, 2.5-2.8 ms per exchange (docs/hardware/aula-bytech-exchange-002-timing.md). A model id is read once on connect, so a conservative ceiling costs nothing."

[timing.command.read_key_travel]
min_gap_before_ms = 1000
settle_after_ms   = 0
evidence          = "hardware"
note              = "Same shape and same reasoning as read_model_id's, and measured the same way: 5 exchanges at >= 1000 ms on our own HERO 84 HE, every answer structurally valid, all five carrying the same four values, every response checksum matching, no stall, 2.4-2.8 ms per exchange (docs/hardware/aula-bytech-exchange-005-actuation-verified.md). Not the device's minimum interval -- nobody measured one. Actuation is read on connect and after a change, so a conservative ceiling costs nothing. The round-trip times matching read_model_id's is the first sign that figure belongs to the transport rather than to one command; it is still not enough to write into [timing.class.safe_read], which would claim it for commands nobody has sent."

[[command]]
group      = 0x82
subcommand = 0x01
name       = "read_model_id"
class      = "safe_read"
evidence   = "hardware"
note       = """
The vendor calls this readDeviceUUID; the value it returns identifies a model \
and a key layout, not a physical unit, so our name says model id. Recovered \
from the vendor's configurator bundle by static analysis \
(docs/prior-art/aula-bytech-readdeviceuuid.md), then sent to our own board.

Was `bootstrap_probe` on `vendor_artifact` evidence until 2026-08-18. It is now \
`safe_read` on `hardware` because it has been sent here and answered here: one \
exchange establishing the semantics (exchange-001) and five establishing that \
the conservative cadence above works (exchange-002). Promoted by hand after \
review, which is the only way this transition happens -- nothing in the program \
rewrites this file.

Read-only on the evidence available: it is the first call on the vendor's \
connect path, before any user action, its result is consumed as a table lookup, \
nothing is written back, group 0x82 has no write counterpart anywhere in the \
vendor bundle, and six reads here changed nothing observable. That last clause \
is the weakest one and is meant to be: "we saw no effect" is not "there is no \
effect".
"""

# --- what the bootstrap door produced ----------------------------------------
#
# Both entries below arrived as `bootstrap_probe` on 2026-08-18, recovered from
# the vendor artifact and never sent from here. Both have now been through that
# door once, and they left it in opposite directions -- which is the outcome the
# class was designed to allow, rather than an inconsistency.
#
# `read_key_travel` answered, was checked against four values a person set in the
# official configurator, and is a `safe_read` below.
#
# `read_travel_precision` returned our own frame byte for byte. That is what an
# unsupported command looks like on boards in this class, and with an empty
# payload it cannot be told apart from a genuine "nothing to report". So it is
# `unknown`: a class the generator refuses to emit any command id for. It keeps
# its note because the knowledge is worth having and the next person should not
# have to rediscover it -- but nothing in the program can send it, and there is
# no value of any type that means "this command".
#
# `ProbeCommandId` is consequently empty again, which is the state to prefer: it
# means nothing is awaiting a first exchange.

[[command]]
group      = 0x82
subcommand = 0x08
name       = "read_travel_precision"
class      = "unknown"
evidence   = "vendor_artifact"
note       = """
One byte: the micrometres one travel LSB represents. The vendor reads it once \
when its trigger page mounts and derives every millimetre figure on that page \
from it -- actuation, both rapid-trigger sensitivities, the dead zone, the \
slider step and the displayed decimal count. So this is not an incidental \
detail: without it a travel value cannot be converted at all, and a plausible \
guess at the scale is exactly the mistake that turns a wrong number into a \
confident one. Same group as the verified read_model_id, which is corroboration \
and not evidence. The request carries no data; the vendor forces the response \
length to 1 rather than trusting the frame's own length byte.
"""

[[command]]
group      = 0x93
subcommand = 0x00
name       = "read_key_travel"
class      = "safe_read"
evidence   = "hardware"
note       = """
Per-key actuation point. Records of five bytes: key id u16 big-endian, travel \
u16 big-endian, one pad byte. Travel is in units of read_travel_precision \
micrometres.

The key id is the VENDOR'S OWN key numbering and is NOT a HID usage. The \
vendor calls it `keyValue`, indexes its layout tables by it, and carries the \
HID usage as a separate `keycode` field on a different command. W A S D are \
30 43 44 45 here; their HID usages 26 4 22 7 are `=`, F3, `8` and F6 on the \
same board. Confusing the two produces a well-formed answer about the wrong \
keys, which is what happened on 2026-08-18 and is written up in \
docs/hardware/aula-bytech-exchange-004-actuation.md.

The second byte is NOT a subcommand index. It packs the layer and the OS mode \
as (layer & 3) | ((system & 7) << 2), and 0x00 is layer Normal with system \
Windows. This entry therefore authorises reading that layer and that mode and \
nothing else; Fn1, Fn2, Tap or MacOS are different bytes and would each need \
their own reviewed entry. An actuation value on this board is per key per layer \
per OS mode, not simply per key.

The vendor chunks these so the response fits one frame: eleven keys per \
exchange. Our codec is single-frame by choice, so a request here must name at \
most eleven keys. The production read names four -- W, A, S, D.

Write twin is group 0x13. KNOWN WRITE, NOT IMPLEMENTED, and it will not be \
given any command id.

Was `bootstrap_probe` on `vendor_artifact` evidence until 2026-08-18. It is now \
`safe_read` on `hardware` because the answer was checked against something \
outside this project rather than against our own belief about it: the official \
AULA configurator wrote four DIFFERENT actuation points -- 0.51, 1.02, 1.49 and \
2.00 mm -- was closed, and one read here returned raw 51, 102, 149 and 200 in \
that order. Exact on all four. Four distinct values are what rules out a \
decoder that reports one record four times, which every earlier exchange left \
open because every earlier exchange returned a uniform value \
(docs/hardware/aula-bytech-exchange-005-actuation-verified.md). Promoted by \
hand after review, which is the only way this transition happens -- nothing in \
the program rewrites this file.

Read-only on the evidence available: it is the vendor's own read path for its \
trigger page, its write twin is a different group, ten reads here changed \
nothing observable, and the values it returns are the ones another program \
wrote. That last clause is the strongest read-only evidence this project has \
for any command, and it is still not proof that there is no side effect.
"""
