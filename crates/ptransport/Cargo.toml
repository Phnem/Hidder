[package]
name = "ptransport"
description = "HID transport. Owns every physical device handle; nothing above this layer sees one."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
authors.workspace = true

# DAG position: bottom. This crate must never depend on any other `p*` crate.
# See architecture/INITIAL_REVIEW.md §9.
[dependencies]
hidapi.workspace = true
thiserror.workspace = true
log.workspace = true

# Only the `inventory` example needs to serialise a report. Kept as a dev
# dependency so nothing serde-shaped enters the crate's own public API by
# accident: the hardware-inventory artifact is a development output, not a
# product data format.
[dev-dependencies]
serde_json.workspace = true

